name: CI - Mizan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # Builds the production image and proves the app boots and serves.
  # The Tiingo key is a dummy: /health reports status without calling the API,
  # so no real credentials or network quota are used in CI.
  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mizan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name mizan -p 8000:8000 \
            -e TIINGO_API_KEY=dummy \
            -e PORT=8000 \
            mizan:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            sleep 3
            if curl -fsS http://localhost:8000/health | grep -q '"ok":true'; then
              echo "app is serving"
              exit 0
            fi
          done
          echo "app did not become healthy"
          exit 1

      - name: Confirm the frontend is served
        run: curl -fsS http://localhost:8000/ | grep -qi "<!DOCTYPE html>"

      - name: Container logs
        if: always()
        run: docker logs mizan
